<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 40px;
            background: #f8fafc;
            color: #1e293b;
        }
        .container {
            max-width: 450px;
            margin: 40px auto;
        }
        .card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0284c7;
            margin-top: 0;
            font-size: 1.5rem;
        }
        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .btn-submit {
            background: #0284c7;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .btn-submit:hover {
            background: #0369a1;
        }
        .hint {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #475569;
            margin-top: 18px;
        }
        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
        }
        .links a {
            color: #0284c7;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Student Login</h1>
        <p class="subtitle">PDF Section 33.1: Form submitted via POST to <code>LoginServlet</code>.</p>

        <form action="login" method="post">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" value="admin" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" value="1234" required>
            </div>

            <button type="submit" class="btn-submit">Login</button>
        </form>

        <div class="hint">
            <strong>Lab Credentials (PDF Sec 33.2):</strong><br>
            Username: <code>admin</code><br>
            Password: <code>1234</code>
        </div>

        <div class="links">
            <a href="index.html">&larr; Return to Lab Portal</a>
        </div>
    </div>
</div>
</body>
</html>
